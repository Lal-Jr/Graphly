# Local production-like stack: Postgres + Graphly on http://localhost:8080
#
#   docker compose up                    one instance
#   docker compose --profile multi up    a second instance on :8081 against the same database,
#                                        for checking realtime fan-out (scripts/multi-instance.sh)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: graphly
      POSTGRES_PASSWORD: graphly
      POSTGRES_DB: graphly
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U graphly']
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://graphly:graphly@db:5432/graphly?sslmode=disable
      # Set to true when serving over HTTPS (required for real deployments).
      SECURE_COOKIES: 'false'
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

  # Same image and database as `app`. Realtime events, presence, the delivery outbox and the
  # forecast job all coordinate through Postgres, so any number of these can run side by side.
  app2:
    profiles: [multi]
    build: .
    environment:
      DATABASE_URL: postgres://graphly:graphly@db:5432/graphly?sslmode=disable
      SECURE_COOKIES: 'false'
    ports:
      - '8081:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
