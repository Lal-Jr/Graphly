<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16181D" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2316181D'/><path d='M9 21.5L16 10.5' stroke='%2334D39E' stroke-width='2.4'/><path d='M16 10.5L23 21.5' stroke='%23FF6B43' stroke-width='2.4'/><circle cx='9' cy='21.5' r='3.4' fill='%2334D39E'/><circle cx='16' cy='10.5' r='3.4' fill='white'/><circle cx='23' cy='21.5' r='3.4' fill='%23FF6B43'/></svg>" />
    <title>Graphly — plan with the graph</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var m = localStorage.getItem('graphly:theme') || 'system'
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'only light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
